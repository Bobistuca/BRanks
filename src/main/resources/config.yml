# ======================================================================
#  BRanks - general configuration
#
#  RANKS live in ranks.yml and TAGS in tags.yml (same folder).
#  Everything can be done with commands (/rank and /tag) or by editing
#  the files and running /rank reload.
#
#  Hierarchy: every rank has a LEVEL from 1 (lowest) to 2556 (highest).
#  Set it with /rank create <name> <level> or /rank level <rank> <level>.
#  Tags can require a rank: that rank AND every rank with a higher level can use them.
#
#  Colors: &a, &l ... | names (red, blue, gold) | hex (#FF8800, 1.16+)
#
#  Format placeholders:
#    {player} {tag} {prefix} {suffix} {rank} {color} {chatcolor} {message}
#    {display} {displaycolor} (tab list: tag if any, otherwise rank prefix, and its color)
#  (Spaces between tag/prefix/suffix are added automatically.)
# ======================================================================

chat:
  # If you use another chat plugin, set this to false.
  enabled: true
  format: "{tag}{prefix}{color}{player}{suffix}&7: {chatcolor}{message}"
  # Players with the branks.chat.colors permission can use &a, &l... in chat
  colors-in-message: true

# Tab list: [TAG or RANK] + player name in that tag/rank color.
# {display} = the tag if the player uses one, otherwise the rank prefix.
# {displaycolor} = the color of that tag/rank.
tablist:
  enabled: true
  format: "{display}{displaycolor}{player}"

# Prefix above the head, and tab list order following the rank hierarchy
nametag:
  enabled: true

# If false, BRanks does not hand out permissions (use this if you prefer LuckPerms)
permissions:
  enabled: true

