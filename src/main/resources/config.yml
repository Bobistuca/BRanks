  herda-adicionado: "&aO rank {rank}&a agora herda de {outro}&a."
  herda-removido: "&aO rank {rank}&a não herda mais de {outro}&a."
  herda-invalido: "&cNão é possível herdar desse rank (ele mesmo, ou já herda)."
  herda-nao-tem: "&cO rank {rank}&c não herda de {outro}&c."
  mover-ok: "&aRank {rank}&a movido na hierarquia."
  mover-limite: "&cO rank {rank}&c já está no limite da hierarquia."
