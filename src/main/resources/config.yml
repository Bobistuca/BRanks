  rank-ja-existe: "&cO rank '{rank}' já existe."
  nome-invalido: "&cNome inválido. Use apenas letras, números, - e _ (até 16 caracteres)."
  nome-reservado: "&cEsse nome é reservado, escolha outro."
  uso: "&cUso: &f{uso}"
  rank-criado: "&aRank {rank} &acriado! Edite com /rank prefixo, /rank cor, /rank permissao..."
  rank-apagado: "&aRank '{rank}' apagado."
  rank-definido: "&aRank de &f{jogador} &aalterado para {rank}&a."
  rank-limpo: "&aRank de &f{jogador} &aresetado para o padrão."
  rank-recebido: "&aSeu rank agora é {rank}&a."
  rank-editado: "&aRank {rank}&a atualizado: &f{campo} &a= &r{valor}"
  cor-invalida: "&cCor inválida. Use um nome (vermelho, azul...), código (&c) ou hex (#FF8800)."
  perm-adicionada: "&aPermissão &f{permissao} &aadicionada ao rank {rank}&a."
  perm-removida: "&aPermissão &f{permissao} &aremovida do rank {rank}&a."
