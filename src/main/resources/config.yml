# ======================================================================
#  BRanks - configuracao geral
#
#  Os RANKS ficam em ranks.yml e as TAGS em tags.yml (na mesma pasta).
#  Tudo pode ser feito por comandos (/rank e /tag) ou editando os arquivos
#  e usando /rank recarregar.
#
#  Hierarquia: a ORDEM dos ranks no ranks.yml define quem e mais alto
#  (o primeiro e o mais alto). Nao existem numeros de peso.
#
#  Cores: &a, &l ... | nomes (vermelho, azul, dourado) | hex (#FF8800, 1.16+)
#
#  Placeholders de formato:
#    {jogador} {tag} {prefixo} {sufixo} {rank} {cor} {corchat} {mensagem}
#  (Espacos entre tag/prefixo/sufixo sao colocados automaticamente.)
# ======================================================================

chat:
  # Se voce usa outro plugin de chat, coloque false.
  ativar: true
  formato: "{tag}{prefixo}{cor}{jogador}{sufixo}&7: {corchat}{mensagem}"
  # Jogadores com a permissao branks.chat.cores podem usar &a, &l... no chat
  cores-na-mensagem: true

tablist:
  ativar: true
  formato: "{prefixo}{cor}{jogador}"

# Prefixo acima da cabeca e ordem da tab pela hierarquia dos ranks
nametag:
  ativar: true

# Se false, o BRanks nao entrega permissoes (use isso se preferir LuckPerms)
permissoes:
  ativar: true

mensagens:
  sem-permissao: "&cVocê não tem permissão para isso."
  apenas-jogador: "&cApenas jogadores podem usar este comando."
  jogador-nao-encontrado: "&cJogador '{jogador}' não encontrado (ele precisa já ter entrado no servidor)."
