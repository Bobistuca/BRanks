name: BRanks
main: com.branks.BRanks
version: 1.1.0
api-version: '1.13'
author: Bobistuca
description: Simple ranks and tags plugin with permissions, fully configurable by commands or files.
commands:
  rank:
    description: Manage ranks
    usage: /<command> help
    aliases: [ranks, brank]
  tag:
    description: Choose or manage tags
    usage: /<command> help
    aliases: [tags, btag]
  setrank:
    description: Set the rank of a player
    usage: /<command> <player> <rank>
  settag:
    description: Set the tag of a player
    usage: /<command> <player> <tag>
permissions:
  branks.admin:
    description: Allows managing ranks and tags
    default: op
  branks.tag.use:
    description: Allows choosing tags
    default: true
  branks.chat.colors:
    description: Allows using colors in chat
    default: op
